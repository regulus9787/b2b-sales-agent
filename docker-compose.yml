# ============================================================
# docker compose up --build
#   后端: http://localhost:3000        Swagger UI: http://localhost:3000/docs
#   前端: http://localhost:5173
# 默认 Mock 模式（LLM_API_KEY 为空），无需任何密钥即可跑通全流程。
# ============================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-agent-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_PATH: /app/data/sales-agent.db
      LOG_LEVEL: info
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_THINKING: ${LLM_THINKING:-disabled}
    ports:
      - '3000:3000'
    volumes:
      - sales-agent-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ''
    container_name: sales-agent-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '5173:80'

volumes:
  sales-agent-data:
